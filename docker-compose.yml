services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-private_advisor}
      POSTGRES_USER: ${POSTGRES_USER:-private_advisor}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-private_advisor_dev_password}
    volumes:
      - private_advisor_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-private_advisor} -d ${POSTGRES_DB:-private_advisor}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    env_file: .env
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    environment:
      NEXT_PUBLIC_API_BASE: ${NEXT_PUBLIC_API_BASE:-http://localhost:8000}
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  private_advisor_pgdata:
